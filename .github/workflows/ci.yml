name: FrameZero CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build Engine & Tests
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Run Deterministic Unit Tests
      working-directory: ${{github.workspace}}/build
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          ./Release/FrameZeroTests.exe
        else
          ./FrameZeroTests
        fi
      shell: bash

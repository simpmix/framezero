<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Engine Editor UI</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-shadow: rgba(0, 0, 0, 0.2);
      --accent-color: #3b82f6;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .editor-panel {
      width: 400px;
      padding: 2rem;
      border-radius: 16px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px 0 var(--glass-shadow);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 1rem;
      margin-bottom: 0.5rem;
    }

    .panel-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .control-value {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.875rem;
      color: var(--accent-color);
      background: rgba(0, 0, 0, 0.3);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      min-width: 3.5rem;
      text-align: right;
    }

    /* Modern Slider Styling */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 3px;
      border: 1px solid var(--glass-border);
    }

    input[type=range]::-webkit-slider-thumb {
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: var(--text-main);
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -6px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      transition: background 0.2s, transform 0.1s;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      background: var(--accent-color);
      transform: scale(1.2);
    }

    input[type=range]::-moz-range-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 3px;
      border: 1px solid var(--glass-border);
    }

    input[type=range]::-moz-range-thumb {
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: var(--text-main);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      transition: background 0.2s, transform 0.1s;
    }

    input[type=range]::-moz-range-thumb:hover {
      background: var(--accent-color);
      transform: scale(1.2);
    }
  </style>
</head>
<body>

  <div class="editor-panel">
    <div class="panel-header">
      <h2 class="panel-title">Character Properties</h2>
    </div>

    <!-- Walk Speed -->
    <div class="control-group">
      <div class="control-header">
        <label class="control-label" for="walkSpeed">Walk Speed</label>
        <span class="control-value" id="walkSpeedVal">10.0</span>
      </div>
      <input type="range" id="walkSpeed" name="walkSpeed" min="1.0" max="20.0" step="0.1" value="10.0">
    </div>

    <!-- Jump Force -->
    <div class="control-group">
      <div class="control-header">
        <label class="control-label" for="jumpForce">Jump Force</label>
        <span class="control-value" id="jumpForceVal">15.0</span>
      </div>
      <input type="range" id="jumpForce" name="jumpForce" min="1.0" max="30.0" step="0.1" value="15.0">
    </div>

    <!-- Hitbox Damage -->
    <div class="control-group">
      <div class="control-header">
        <label class="control-label" for="hitboxDamage">Hitbox Damage</label>
        <span class="control-value" id="hitboxDamageVal">50.0</span>
      </div>
      <input type="range" id="hitboxDamage" name="hitboxDamage" min="1.0" max="100.0" step="0.5" value="50.0">
    </div>
  </div>

  <script>
    // Elements
    const sliders = [
      { id: 'walkSpeed', valId: 'walkSpeedVal', name: 'walkSpeed' },
      { id: 'jumpForce', valId: 'jumpForceVal', name: 'jumpForce' },
      { id: 'hitboxDamage', valId: 'hitboxDamageVal', name: 'hitboxDamage' }
    ];

    // Throttle helper to avoid spamming the local server
    function throttle(func, limit) {
      let inThrottle;
      return function() {
        const args = arguments;
        const context = this;
        if (!inThrottle) {
          func.apply(context, args);
          inThrottle = true;
          setTimeout(() => inThrottle = false, limit);
        }
      }
    }

    // Send update request
    const sendUpdate = (name, value) => {
      // Ensure formatted value (e.g. 15.5)
      const valStr = Number(value).toFixed(1);
      
      fetch(`http://localhost:8080/api/update?var=${encodeURIComponent(name)}&val=${encodeURIComponent(valStr)}`, {
        method: 'GET',
        mode: 'no-cors' // often needed for simple local dev if CORS isn't set up on the engine side
      }).catch(err => {
        console.error('Failed to update property:', err);
      });
    };

    // Use a small throttle to prevent flooding during fast drags
    const throttledUpdate = throttle(sendUpdate, 50);

    sliders.forEach(config => {
      const slider = document.getElementById(config.id);
      const display = document.getElementById(config.valId);

      // Input event fires continuously while dragging
      slider.addEventListener('input', (e) => {
        const value = e.target.value;
        // Update the display immediately
        display.textContent = Number(value).toFixed(1);
        
        // Send update to server
        throttledUpdate(config.name, value);
      });
      
      // Change event fires when dragging finishes
      slider.addEventListener('change', (e) => {
        sendUpdate(config.name, e.target.value);
      });
    });
  </script>
</body>
</html>
